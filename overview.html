<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月历总览 · 不急及及代办 · bjjj todo</title><link rel="stylesheet" href="style.css"></head><body class="overview"><div id="wallpaper" aria-hidden="true"></div>
<header><span class="brand" title="不急及及代办 · bjjj todo"><img src="icon.png" alt=""><b>bjjj todo</b><small>不急及及代办</small></span><div class="window-actions"><button id="overview-main" title="打开主窗口">↗</button><button id="overview-minimize" title="最小化">−</button><button id="overview-maximize" title="最大化或还原">□</button><button id="overview-close" title="关闭总览">×</button></div></header>
<main><div class="overview-toolbar"><div><span class="eyebrow">A LITTLE PLAN FOR THE MONTH</span><h1 id="overview-month"></h1><p id="overview-summary"></p></div><div class="overview-navigation"><button id="overview-prev" aria-label="上个月">‹</button><button id="overview-today">本月</button><button id="overview-next" aria-label="下个月">›</button></div></div>
<div class="overview-filters"><input id="overview-search" placeholder="搜索本月事项…" aria-label="搜索事项"><select id="overview-category" aria-label="筛选类型"><option value="">所有类型</option><option value="research">科研</option><option value="work">工作</option><option value="study">学习</option><option value="life">生活</option><option value="other">其他</option></select><select id="overview-priority" aria-label="筛选重要性"><option value="">所有等级</option><option value="high">重要</option><option value="normal">普通</option><option value="low">低优先级</option></select><label><input id="overview-completed" type="checkbox">显示已完成</label><button id="overview-undated">未设置日期 <span id="overview-undated-count">0</span></button></div>
<div class="month-calendar" aria-label="事项月历"><div class="month-weekdays"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div id="month-grid" role="grid" aria-label="月历日期与事项"></div></div>
<div class="overview-bottom"><div class="calendar-legend"><span class="legend-high">重要</span><span class="legend-normal">普通</span><span class="legend-low">低优先级</span></div><small>点击日期查看当天事项 · 点击事项查看详情 · 无截止时间的事项在右上角查看</small></div></main>
<dialog id="overview-day-dialog"><div class="dialog-head"><div><span class="eyebrow">ONE DAY AT A TIME</span><h2 id="overview-day-title"></h2></div><button id="overview-day-close" title="关闭当天事项">×</button></div><div id="overview-day-list"></div><div class="dialog-actions"><button id="overview-day-open">在主窗口查看</button><button id="overview-day-add" class="primary">＋ 新建事项</button></div></dialog><div id="toast" role="status"></div>
<script src="node_modules/lunar-javascript/lunar.js"></script><script src="month-calendar.js"></script><script src="appearance.js"></script><script src="overview.js"></script></body></html>
