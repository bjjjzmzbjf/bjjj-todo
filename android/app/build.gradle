plugins { id 'com.android.application' }
android {
 namespace 'com.bjjj.todo'
 compileSdk 36
 defaultConfig { applicationId 'com.bjjj.todo'; minSdk 26; targetSdk 36; versionCode 2; versionName '1.0.1'; testInstrumentationRunner 'com.bjjj.todo.WidgetTests' }
 signingConfigs { release { if (System.getenv('BJJJ_KEYSTORE')) { storeFile file(System.getenv('BJJJ_KEYSTORE')); storePassword System.getenv('BJJJ_PASSWORD'); keyAlias 'bjjj'; keyPassword System.getenv('BJJJ_PASSWORD') } } }
 buildTypes { release { signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
